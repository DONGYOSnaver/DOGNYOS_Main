<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DỘNGYỘS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 정적 배경 -->
  <div class="bg-earth"></div>

  <div class="page-wrapper">
    <!-- 상단 네비게이션 -->
    <nav class="nav-bar">
      <div class="nav-content">
        <a href="#" class="nav-logo">DỘNGYỘS</a>
        <div class="nav-links">
          <a href="https://dongyosnaver.github.io/DongyosMap/" target="_blank">DMap</a>
          <a href="https://dongyosnaver.github.io/DongyosDglasses/" target="_blank">Dglasses</a>
        </div>
      </div>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main class="hero">
      <h1 class="hero-title">
        생각보다 빠르게.<br>
        상상보다 아름답게.
      </h1>
      <p class="hero-subtitle">모든 것을 새롭게 설계한 가장 강력한 작업 공간</p>
      
      <!-- 검색 영역 -->
      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" class="search-input" placeholder="무엇을 도와드릴까요?" autofocus />
        </div>
      </div>

      <!-- 바로가기 -->
      <div class="shortcuts">
        <a href="https://dongyosnaver.github.io/DongyosMap/" target="_blank" class="shortcut-card">
          <div class="shortcut-icon map-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
            </svg>
          </div>
          <span class="shortcut-name">DMap</span>
          <span class="shortcut-desc">지도 서비스</span>
        </a>

        <a href="https://dongyosnaver.github.io/DongyosDglasses/" target="_blank" class="shortcut-card">
          <div class="shortcut-icon glasses-icon">
            <svg viewBox="0 0 24 24">
              <path d="M6.5 9A4.5 4.5 0 1 0 6.5 18 4.5 4.5 0 0 0 6.5 9zm0 7A2.5 2.5 0 1 1 6.5 11a2.5 2.5 0 0 1 0 5zm11-7a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm0 7a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm-6.5-3.5a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM2 12a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm18 0a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2h-1a1 1 0 0 1-1-1z"/>
            </svg>
          </div>
          <span class="shortcut-name">Dglasses</span>
          <span class="shortcut-desc">스마트 글래스</span>
        </a>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
